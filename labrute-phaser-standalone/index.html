<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaBrute Combat Engine - Standalone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            min-height: 100vh;
        }
        
        #sidebar {
            width: 350px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            overflow-y: auto;
            max-height: 100vh;
        }
        
        #game-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .control-section {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        
        .control-section h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        
        .speed-controls button { background: #2196F3; }
        .speed-controls button:hover { background: #0b7dda; }
        
        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #ddd;
            background: rgba(255,255,255,0.9);
        }
        
        .stat-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        
        .stat-item {
            padding: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #aaa;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }
        
        #fight-log {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .log-entry {
            margin: 2px 0;
            padding: 2px 5px;
        }
        
        .log-hit { color: #ff6b6b; }
        .log-block { color: #4ecdc4; }
        .log-evade { color: #ffe66d; }
        .log-move { color: #95e1d3; }
        .log-death { color: #ff4757; font-weight: bold; }
        .log-skill { color: #a29bfe; }
        
        #overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>⚔️ LaBrute Combat Engine</h2>
        
        <div class="control-section">
            <h3>Combat Controls</h3>
            <button id="btn-generate">Generate New Fight</button>
            <button id="btn-play">▶ Play</button>
            <button id="btn-pause">⏸ Pause</button>
            <button id="btn-reset">↺ Reset</button>
        </div>
        
        <div class="control-section speed-controls">
            <h3>Speed</h3>
            <button data-speed="0.5">0.5x</button>
            <button data-speed="1" style="background: #45a049;">1x</button>
            <button data-speed="2">2x</button>
            <button data-speed="4">4x</button>
        </div>
        
        <div class="control-section">
            <h3>Fighter 1 (Left)</h3>
            <input type="text" id="fighter1-name" placeholder="Name" value="Brutus">
            <div class="stat-display">
                <div class="stat-item">
                    <div class="stat-label">STR</div>
                    <div class="stat-value" id="fighter1-str">10</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">AGI</div>
                    <div class="stat-value" id="fighter1-agi">10</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">SPD</div>
                    <div class="stat-value" id="fighter1-spd">10</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">HP</div>
                    <div class="stat-value" id="fighter1-hp">100</div>
                </div>
            </div>
        </div>
        
        <div class="control-section">
            <h3>Fighter 2 (Right)</h3>
            <input type="text" id="fighter2-name" placeholder="Name" value="Maximus">
            <div class="stat-display">
                <div class="stat-item">
                    <div class="stat-label">STR</div>
                    <div class="stat-value" id="fighter2-str">12</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">AGI</div>
                    <div class="stat-value" id="fighter2-agi">8</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">SPD</div>
                    <div class="stat-value" id="fighter2-spd">8</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">HP</div>
                    <div class="stat-value" id="fighter2-hp">120</div>
                </div>
            </div>
        </div>
        
        <div class="control-section">
            <h3>Fight Log</h3>
            <div id="fight-log"></div>
        </div>
    </div>
    
    <div id="game-container">
        <div id="overlay-info"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
