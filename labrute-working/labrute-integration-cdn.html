<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaBrute - Moteur de Combat Phaser+Spine (CDN)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #game-container canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        /* Interface LaBrute */
        .labrute-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        
        .labrute-ui * {
            pointer-events: auto;
        }
        
        .combat-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            gap: 10px;
        }
        
        .combat-controls button {
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .combat-controls button:hover {
            background: #357abd;
        }
        
        .combat-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
        }
        
        .combat-logs {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 8px;
            padding: 10px;
            max-width: 300px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
        }
    </style>
    
    <!-- Phaser et Spine depuis CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-phaser@4.1.55/dist/spine-phaser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Le jeu Phaser sera injecté ici -->
    </div>
    
    <!-- Interface LaBrute -->
    <div class="labrute-ui">
        <div class="combat-controls">
            <button id="play-pause">⏸️ Pause</button>
            <button id="speed-toggle">⚡ x1</button>
            <button id="sound-toggle">🔊 Son</button>
            <button id="music-toggle">🎵 Musique</button>
        </div>
        
        <div class="combat-info">
            <div>Combat LaBrute</div>
            <div id="fight-id">ID: -</div>
            <div id="fight-progress">Étapes: 0/0</div>
        </div>
        
        <div class="combat-logs">
            <div>Logs de Combat</div>
            <div id="combat-log-content"></div>
        </div>
    </div>

    <script>
        // LaBruteAdapter sans imports ES6
        class LaBruteAdapter {
            constructor() {
                this.laBruteData = null;
                this.actionIndex = 0;
                this.actionQueue = [];
                this.transformedFighters = null;
            }

            loadLaBruteFight(fightData) {
                console.log('📥 LaBruteAdapter: Chargement des données', fightData);
                this.laBruteData = fightData;
                this.actionIndex = 0;
                this.actionQueue = this.generateActionQueue(fightData);
                this.transformedFighters = this.transformFighters(fightData);
                console.log('✅ Données LaBrute chargées:', this.actionQueue.length, 'actions');
                return this.actionQueue;
            }

            generateActionQueue(fightData) {
                const actions = [];
                
                // Actions par défaut si pas de vraies données
                if (!fightData || !fightData.steps) {
                    console.log('⚠️ Pas de données LaBrute, génération d\'actions par défaut');
                    actions.push(
                        { actionType: 'move', fighterId: 'fighter1', targetId: 'fighter2' },
                        { actionType: 'attack', attacker: 'fighter1', target: 'fighter2', damage: 10 },
                        { actionType: 'moveBack', fighterId: 'fighter1' },
                        { actionType: 'move', fighterId: 'fighter2', targetId: 'fighter1' },
                        { actionType: 'attack', attacker: 'fighter2', target: 'fighter1', damage: 8 },
                        { actionType: 'moveBack', fighterId: 'fighter2' },
                        { actionType: 'death', fighter: 'fighter2' },
                        { actionType: 'end' }
                    );
                    return actions;
                }

                // Traitement des vraies données LaBrute
                fightData.steps.forEach((step, index) => {
                    console.log(`Étape ${index}:`, step);
                    
                    switch (step.action) {
                        case 'fight':
                            if (step.attacker && step.defender) {
                                actions.push({ actionType: 'move', fighterId: step.attacker.name, targetId: step.defender.name });
                                actions.push({ 
                                    actionType: 'attack', 
                                    attacker: step.attacker.name, 
                                    target: step.defender.name,
                                    damage: step.damage || 10
                                });
                                actions.push({ actionType: 'moveBack', fighterId: step.attacker.name });
                            }
                            break;
                        
                        case 'end':
                            actions.push({ actionType: 'end' });
                            break;
                        
                        default:
                            console.log('Action LaBrute non reconnue:', step.action);
                    }
                });

                return actions;
            }

            transformFighters(fightData) {
                const fighters = [];
                
                // Fighters par défaut si pas de vraies données
                if (!fightData || !fightData.fighters) {
                    fighters.push({
                        id: 'fighter1',
                        name: 'Fighter 1',
                        side: 'left',
                        baseScale: 0.3,
                        stats: {
                            name: 'Fighter 1',
                            health: 100,
                            maxHealth: 100,
                            strength: 15
                        }
                    });
                    fighters.push({
                        id: 'fighter2',
                        name: 'Fighter 2',
                        side: 'right',
                        baseScale: 0.3,
                        stats: {
                            name: 'Fighter 2',
                            health: 100,
                            maxHealth: 100,
                            strength: 12
                        }
                    });
                    return fighters;
                }

                // Transformation des vraies données LaBrute
                fightData.fighters.forEach((fighter, index) => {
                    fighters.push({
                        id: fighter.name || `fighter${index + 1}`,
                        name: fighter.name || `Fighter ${index + 1}`,
                        side: index === 0 ? 'left' : 'right',
                        baseScale: 0.3,
                        stats: {
                            name: fighter.name || `Fighter ${index + 1}`,
                            health: fighter.hp || 100,
                            maxHealth: fighter.maxHp || fighter.hp || 100,
                            strength: fighter.strength || 15
                        }
                    });
                });

                return fighters;
            }

            getNextStep() {
                if (this.actionIndex >= this.actionQueue.length) {
                    return null;
                }
                return this.actionQueue[this.actionIndex++];
            }

            getTransformedFighters() {
                return this.transformedFighters;
            }

            getCombatInfo() {
                return {
                    fightId: this.laBruteData?.id || 'demo',
                    currentStep: this.actionIndex,
                    totalSteps: this.actionQueue.length,
                    winner: this.laBruteData?.winner || null
                };
            }
        }

        // LaBruteFightScene sans imports ES6 (version intégrée LaBrute)
        class LaBruteFightScene extends Phaser.Scene {
            constructor() { 
                super({ key: 'LaBruteFight' }); 
                this.laBruteAdapter = new LaBruteAdapter();
                this.currentAction = null;
                this.isPlaying = true;
                this.fightSpeed = 1;
                this.fightLoaded = false;
                this.isProcessingStep = false;
                this.stepTimer = null;
            }

            preload() {
                // Charger les assets Spine
                this.load.spine('spineboy', 'assets/spine/spineboy.json', 'assets/spine/spineboy.atlas');
            }

            create() {
                console.log('🎮 LaBruteFightScene: Création de la scène');
                
                // Configuration de la caméra
                this.cameras.main.setZoom(1);
                this.cameras.main.setScroll(0, 0);
                this.cameras.main.roundPixels = true;
                this.cameras.main.setBounds(0, 0, 1024, 768);

                // Zone de combat
                this.setupCombatZone();

                // Écouter les messages de LaBrute
                this.setupMessageListener();

                // État initial
                this.fighters = [];
                this.combatActive = false;
                
                console.log('✅ LaBruteFightScene prête');
            }

            setupCombatZone() {
                this.combatZone = {
                    leftMinX: 200,
                    leftMaxX: 400,
                    rightMinX: 624,
                    rightMaxX: 824,
                    minY: 200,
                    maxY: 568
                };
            }

            setupMessageListener() {
                window.addEventListener('message', (event) => {
                    console.log('LaBruteFightScene: Message reçu:', event.data);
                    
                    const payload = event && event.data && typeof event.data === 'object' ? event.data : null;
                    if (!payload || !payload.type) return;

                    const { type, data } = payload;
                    
                    switch (type) {
                        case 'LOAD_FIGHT_STEPS':
                            console.log('📥 Reçu données de combat LaBrute:', data);
                            if (payload.data && typeof payload.data === 'object') {
                                this.loadLaBruteFight(payload.data);
                            } else if (data && typeof data === 'object') {
                                this.loadLaBruteFight(data);
                            }
                            break;
                        case 'PLAY_FIGHT':
                            console.log('▶️ Démarrage du combat');
                            this.startFight();
                            break;
                        case 'PAUSE_FIGHT':
                            console.log('⏸️ Pause du combat');
                            this.pauseFight();
                            break;
                        case 'SET_SPEED':
                            console.log(`⚡ Vitesse: x${data?.speed || 1}`);
                            this.setFightSpeed(data?.speed || 1);
                            break;
                    }
                });

                console.log('Envoi du message READY au parent');
                window.parent.postMessage({ type: 'READY' }, '*');
                window.postMessage({ type: 'READY' }, '*');
            }

            loadLaBruteFight(fightData) {
                console.log('🔗 Chargement combat LaBrute:', fightData);
                
                // Reset boucle si nécessaire
                if (this.stepTimer) { try { this.stepTimer.remove(false); } catch (e) {} }
                this.isProcessingStep = false;
                this.isPlaying = false;
                this.combatActive = false;

                // Détruire d'anciens fighters
                if (this.fighters && this.fighters.length) {
                    this.fighters.forEach(f => {
                        try { f.sprite.destroy(); } catch(e) {}
                        try { f.shadow?.destroy(); } catch(e) {}
                    });
                }

                // Charger les données dans l'adaptateur
                this.laBruteAdapter.loadLaBruteFight(fightData);
                
                // Créer les combattants
                this.createFighters();
                
                this.fightLoaded = true;
                this.sendMessage('FIGHT_LOADED', {
                    fightId: this.laBruteAdapter.getCombatInfo().fightId,
                    totalSteps: this.laBruteAdapter.getCombatInfo().totalSteps
                });
                
                // Démarrer automatiquement le combat après un court délai
                this.time.delayedCall(1500, () => {
                    console.log('⏱️ Démarrage automatique après délai');
                    this.startFight();
                });
            }

            createFighters() {
                const transformedFighters = this.laBruteAdapter.getTransformedFighters();
                
                if (!transformedFighters) {
                    console.error('❌ Impossible de créer les combattants');
                    return;
                }

                console.log('Création des combattants avec données:', transformedFighters);
                this.fighters = [];
                
                // Force la position: Premier combattant à gauche, deuxième à droite
                const positions = [
                    { 
                        x: (this.combatZone.leftMinX + this.combatZone.leftMaxX) / 2,
                        y: (this.combatZone.minY + this.combatZone.maxY) / 2 - 30,
                        side: 'left'
                    },
                    {
                        x: (this.combatZone.rightMinX + this.combatZone.rightMaxX) / 2,
                        y: (this.combatZone.minY + this.combatZone.maxY) / 2 + 30,
                        side: 'right'
                    }
                ];
                
                transformedFighters.forEach((fighterData, index) => {
                    const pos = positions[Math.min(index, 1)];
                    const baseX = pos.x;
                    const baseY = pos.y;
                    
                    fighterData.side = pos.side;
                    
                    console.log(`Fighter ${index} - ID: ${fighterData.id}, Name: ${fighterData.name}, Position: ${pos.side}, X: ${baseX}, Y: ${baseY}`);
                    
                    const sprite = this.add.spine(baseX, baseY, 'spineboy');
                    const scale = (fighterData.baseScale || 0.3) * this.getFighterScale(baseY);
                    
                    // Direction: gauche regarde à droite, droite regarde à gauche
                    sprite.setScale(pos.side === 'left' ? scale : -scale, scale);
                    
                    this.setSpineAnim(sprite, 'idle', true);
                    
                    const shadow = this.add.ellipse(
                        baseX, 
                        baseY + this.getShadowOffset(baseY), 
                        100 * this.getFighterScale(baseY), 
                        25 * this.getFighterScale(baseY), 
                        0x000000, 
                        0.35
                    );
                    
                    const fighter = {
                        ...fighterData,
                        sprite,
                        shadow,
                        baseX,
                        baseY,
                        currentX: baseX,
                        currentY: baseY
                    };
                    
                    this.fighters.push(fighter);
                });

                // Ordre d'affichage (Z)
                this.fighters.forEach((f, i) => { f.sprite.setDepth(10 + i); f.shadow.setDepth(5 + i); });

                console.log(`✅ ${this.fighters.length} combattants créés`);
            }

            startFight() {
                console.log('🚀 LaBruteFightScene.startFight() appelé');
                
                if (!this.fightLoaded) {
                    console.log('❌ Combat non chargé, impossible de démarrer');
                    return;
                }
                
                if (this.isPlaying) {
                    console.log('ℹ️ Combat déjà en cours, ignoré');
                    return;
                }

                this.combatActive = true;
                this.isPlaying = true;
                console.log('✅ Combat démarré, isPlaying=true, combatActive=true');

                // Démarrer la boucle si rien en cours
                if (!this.isProcessingStep) {
                    console.log('▶️ Exécution de la première étape');
                    this.executeNextStep();
                } else {
                    console.log('⏳ Une étape est déjà en cours de traitement');
                }
            }

            pauseFight() {
                this.isPlaying = false;
                if (this.stepTimer) { try { this.stepTimer.remove(false); } catch (e) {} }
            }

            setFightSpeed(speed) {
                this.fightSpeed = speed;
            }

            getDelay(ms) {
                const factor = this.fightSpeed && this.fightSpeed > 0 ? this.fightSpeed : 1;
                return Math.max(50, Math.round(ms / factor));
            }

            sendMessage(type, data) {
                window.parent.postMessage({ type, data }, '*');
                window.postMessage({ type, data }, '*');
            }

            async executeNextStep() {
                console.log('⏭️ executeNextStep appelé');
                
                if (!this.combatActive || !this.isPlaying) {
                    console.log('❌ Combat inactif ou en pause', {combatActive: this.combatActive, isPlaying: this.isPlaying});
                    return;
                }
                
                if (this.isProcessingStep) {
                    console.log('⏱️ Une étape est déjà en cours de traitement, attente...');
                    return;
                }

                console.log('🔍 Récupération de l\'action suivante...');
                const action = this.laBruteAdapter.getNextStep();

                if (!action) {
                    console.log('🏁 Plus d\'actions à exécuter, fin du combat');
                    this.endCombat();
                    return;
                }

                console.log('✅ Action récupérée:', action);
                this.isProcessingStep = true;
                
                // Envoyer mise à jour de progression
                this.sendMessage('FIGHT_STEP', this.laBruteAdapter.getCombatInfo());
                
                try {
                    console.log('⚙️ Exécution de l\'action', action.actionType);
                    await this.executeAction(action);
                    console.log('✅ Action terminée');
                } catch (e) {
                    console.error('❌ Erreur lors de l\'exécution de l\'action:', e);
                } finally {
                    this.isProcessingStep = false;
                }

                if (this.isPlaying) {
                    console.log('▶️ Passage à l\'étape suivante');
                    this.executeNextStep();
                } else {
                    console.log('⏸️ Combat en pause, pas d\'étape suivante');
                }
            }

            executeAction(action) {
                console.log(`🎬 Exécution action: ${action.actionType}`, action);
                this.sendMessage('COMBAT_LOG', { 
                    message: `${action.actionType} - ${action.fighterId || action.attacker || action.fighter || '?'}` 
                });
                
                switch (action.actionType) {
                    case 'move':
                        return this.executeMove(action);
                    case 'moveBack':
                        return this.executeMoveBack(action);
                    case 'attack':
                        return this.executeAttack(action);
                    case 'block':
                        return this.executeBlock(action);
                    case 'evade':
                        return this.executeEvade(action);
                    case 'death':
                        return this.executeDeath(action);
                    case 'end':
                        return this.executeEnd(action);
                    default:
                        console.warn(`⚠️ Action non implémentée: ${action.actionType}`, action);
                        return new Promise((resolve) => this.time.delayedCall(this.getDelay(150), resolve));
                }
            }

            executeMove(action) {
                const fighter = this.fighters.find(f => f.id === action.fighterId);
                if (!fighter) return new Promise((resolve) => this.time.delayedCall(this.getDelay(50), resolve));

                this.tweens.killTweensOf([fighter.sprite, fighter.shadow]);
                this.playRun(fighter.sprite);

                let destX = fighter.currentX + 50;
                if (action.targetId) {
                    const target = this.fighters.find(f => f.id === action.targetId);
                    if (target) {
                        destX = target.currentX + (fighter.side === 'left' ? -40 : 40);
                    }
                }
                destX = this.clampXForFighter(fighter, destX);

                const duration = this.computeDurationForDistance(destX - fighter.currentX, 1100);
                return new Promise((resolve) => {
                    this.tweens.add({
                        targets: [fighter.sprite, fighter.shadow],
                        x: destX,
                        duration,
                        ease: 'Power2',
                        onComplete: () => {
                            this.setSpineAnim(fighter.sprite, 'idle', true);
                            fighter.currentX = fighter.sprite.x;
                            resolve();
                        }
                    });
                });
            }

            executeMoveBack(action) {
                const fighter = this.fighters.find(f => f.id === action.fighterId || f.id === action.fighter);
                if (!fighter) return new Promise((resolve) => this.time.delayedCall(this.getDelay(50), resolve));

                this.tweens.killTweensOf([fighter.sprite, fighter.shadow]);
                this.playRun(fighter.sprite);

                const destX = this.clampXForFighter(fighter, fighter.baseX);
                const duration = this.computeDurationForDistance(destX - fighter.currentX, 1100);
                return new Promise((resolve) => {
                    this.tweens.add({
                        targets: [fighter.sprite, fighter.shadow],
                        x: destX,
                        duration,
                        ease: 'Power2',
                        onComplete: () => {
                            this.setSpineAnim(fighter.sprite, 'idle', true);
                            fighter.currentX = fighter.sprite.x;
                            resolve();
                        }
                    });
                });
            }

            executeAttack(action) {
                const attacker = this.fighters.find(f => f.id === action.attacker);
                const target = this.fighters.find(f => f.id === action.target);
                if (!attacker || !target) return new Promise((resolve) => this.time.delayedCall(this.getDelay(50), resolve));

                return new Promise((resolve) => {
                    this.tweens.killTweensOf([attacker.sprite, attacker.shadow]);
                    this.playRun(attacker.sprite);
                    const approachX = target.currentX + (attacker.side === 'left' ? 30 : -30);
                    const duration = this.computeDurationForDistance(approachX - attacker.currentX, 1100);
                    this.tweens.add({
                        targets: [attacker.sprite, attacker.shadow],
                        x: approachX,
                        duration,
                        ease: 'Power2',
                        onComplete: () => {
                            this.setSpineAnim(attacker.sprite, 'attack', false);

                            if (target.stats.health > 0) {
                                target.stats.health = Math.max(0, target.stats.health - (action.damage || 0));
                                this.tweens.add({ targets: target.sprite, alpha: 0.7, duration: this.getDelay(70), yoyo: true });
                            }

                            const backDuration = this.computeDurationForDistance(attacker.currentX - attacker.sprite.x, 1100);
                            this.tweens.add({
                                targets: [attacker.sprite, attacker.shadow],
                                x: attacker.currentX,
                                duration: backDuration,
                                ease: 'Power2',
                                onComplete: () => {
                                    this.setSpineAnim(attacker.sprite, 'idle', true);
                                    resolve();
                                }
                            });
                        }
                    });
                });
            }

            executeBlock(action) {
                const fighter = this.fighters.find(f => f.id === action.fighter);
                if (!fighter) return new Promise((resolve) => this.time.delayedCall(this.getDelay(50), resolve));

                return new Promise((resolve) => {
                    this.tweens.add({
                        targets: fighter.sprite,
                        scaleY: Math.abs(fighter.sprite.scaleY) * 0.9,
                        duration: this.getDelay(120),
                        yoyo: true,
                        ease: 'Sine.easeInOut',
                        onComplete: resolve
                    });
                });
            }

            executeEvade(action) {
                const fighter = this.fighters.find(f => f.id === action.fighter);
                if (!fighter) return new Promise((resolve) => this.time.delayedCall(this.getDelay(50), resolve));

                const direction = fighter.side === 'left' ? -24 : 24;
                this.tweens.killTweensOf([fighter.sprite, fighter.shadow]);
                return new Promise((resolve) => {
                    this.tweens.add({
                        targets: [fighter.sprite, fighter.shadow],
                        x: this.clampXForFighter(fighter, fighter.currentX + direction),
                        duration: this.getDelay(90),
                        yoyo: true,
                        ease: 'Power2',
                        onComplete: () => { resolve(); }
                    });
                });
            }

            executeDeath(action) {
                const fighter = this.fighters.find(f => f.id === action.fighter);
                if (!fighter) return new Promise((resolve) => this.time.delayedCall(this.getDelay(50), resolve));

                fighter.stats.health = 0;

                return new Promise((resolve) => {
                    this.tweens.killTweensOf([fighter.sprite, fighter.shadow]);
                    if (typeof fighter.sprite.setAlpha === 'function') {
                        fighter.sprite.setAlpha(0.8);
                    } else {
                        fighter.sprite.alpha = 0.8;
                    }
                    this.tweens.add({
                        targets: fighter.sprite,
                        scaleY: Math.abs(fighter.sprite.scaleY) * 0.8,
                        duration: this.getDelay(220),
                        ease: 'Power2',
                        onComplete: () => {
                            try { this.setSpineAnim(fighter.sprite, 'death', false); } catch(e) { this.setSpineAnim(fighter.sprite, 'idle', false); }
                            resolve();
                        }
                    });
                });
            }

            executeEnd(_action) {
                return new Promise((resolve) => this.time.delayedCall(this.getDelay(150), resolve));
            }

            endCombat() {
                this.combatActive = false;
                this.isPlaying = false;
                if (this.stepTimer) { try { this.stepTimer.remove(false); } catch (e) {} }
                
                const winner = this.fighters.find(f => f.id === this.laBruteAdapter.laBruteData?.winner);
                
                this.sendMessage('FIGHT_ENDED', { 
                    winner: this.laBruteAdapter.laBruteData?.winner 
                });
            }

            // Méthodes utilitaires
            setSpineAnim(spineObj, name, loop = false) {
                try { 
                    spineObj.animationState.setAnimation(0, name, loop); 
                } catch(e) {
                    // fallback ignored
                }
            }

            playRun(spineObj) {
                try { this.setSpineAnim(spineObj, 'run', true); }
                catch { this.setSpineAnim(spineObj, 'walk', true); }
            }

            getFighterScale(y) {
                return 1 - (y - 384) / 768 * 0.3;
            }

            getShadowOffset(y) {
                return 20 + (y - 384) / 768 * 10;
            }

            clampXForFighter(fighter, desiredX) {
                if (!this.combatZone) return desiredX;
                if (fighter.side === 'left') {
                    return Phaser.Math.Clamp(desiredX, this.combatZone.leftMinX, this.combatZone.leftMaxX);
                }
                return Phaser.Math.Clamp(desiredX, this.combatZone.rightMinX, this.combatZone.rightMaxX);
            }

            computeDurationForDistance(distancePx, pxPerSecond = 900) {
                const seconds = Math.max(0.05, Math.abs(distancePx) / Math.max(100, pxPerSecond));
                return this.getDelay(seconds * 1000);
            }
        }

        // Configuration Phaser
        const config = {
            type: Phaser.AUTO,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                parent: 'game-container',
                width: 1024,
                height: 768
            },
            backgroundColor: '#2d2419',
            plugins: {
                scene: [
                    {
                        key: 'SpinePlugin',
                        plugin: window.SpinePlugin,
                        mapping: 'spine'
                    }
                ]
            },
            scene: [LaBruteFightScene]
        };

        // Démarrer le jeu
        const game = new Phaser.Game(config);
        window.game = game;
    </script>
    
    <script>
        // Interface LaBrute
        let isPlaying = true;
        let fightSpeed = 1;
        let soundOn = true;
        let musicOn = true;
        
        // Contrôles
        document.getElementById('play-pause').addEventListener('click', () => {
            isPlaying = !isPlaying;
            const button = document.getElementById('play-pause');
            button.textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
            
            // Envoyer message au jeu
            window.postMessage({
                type: isPlaying ? 'PLAY_FIGHT' : 'PAUSE_FIGHT'
            }, '*');
        });
        
        document.getElementById('speed-toggle').addEventListener('click', () => {
            fightSpeed = fightSpeed === 1 ? 2 : 1;
            const button = document.getElementById('speed-toggle');
            button.textContent = `⚡ x${fightSpeed}`;
            
            // Envoyer message au jeu
            window.postMessage({
                type: 'SET_SPEED',
                data: { speed: fightSpeed }
            }, '*');
        });
        
        document.getElementById('sound-toggle').addEventListener('click', () => {
            soundOn = !soundOn;
            const button = document.getElementById('sound-toggle');
            button.textContent = soundOn ? '🔊 Son' : '🔇 Son';
        });
        
        document.getElementById('music-toggle').addEventListener('click', () => {
            musicOn = !musicOn;
            const button = document.getElementById('music-toggle');
            button.textContent = musicOn ? '🎵 Musique' : '🎵 Musique';
        });
        
        // Écouter les messages du jeu
        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;
            
            const { type, data } = event.data;
            
            switch (type) {
                case 'FIGHT_LOADED':
                    updateCombatInfo(data);
                    break;
                    
                case 'FIGHT_STEP':
                    updateCombatProgress(data);
                    break;
                    
                case 'FIGHT_ENDED':
                    updateCombatEnd(data);
                    break;
                    
                case 'COMBAT_LOG':
                    appendCombatLog(data.message);
                    break;
            }
        });
        
        function updateCombatInfo(data) {
            document.getElementById('fight-id').textContent = `ID: ${data.fightId}`;
            document.getElementById('fight-progress').textContent = `Étapes: 0/${data.totalSteps}`;
        }
        
        function updateCombatProgress(data) {
            document.getElementById('fight-progress').textContent = `Étapes: ${data.currentStep}/${data.totalSteps}`;
        }
        
        function updateCombatEnd(data) {
            appendCombatLog(`🏆 Combat terminé ! Vainqueur: ${data.winner}`);
        }
        
        function appendCombatLog(message) {
            const logContent = document.getElementById('combat-log-content');
            const logEntry = document.createElement('div');
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContent.appendChild(logEntry);
            
            // Garder seulement les 10 derniers logs
            while (logContent.children.length > 10) {
                logContent.removeChild(logContent.firstChild);
            }
            
            // Auto-scroll vers le bas
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        // Message initial
        appendCombatLog('🎮 Moteur de combat LaBrute prêt');
        
        // Démarrer avec la scène LaBrute
        window.addEventListener('load', () => {
            // Attendre que Phaser soit prêt
            setTimeout(() => {
                // Démarrer directement avec LaBruteFightScene
                if (window.game && window.game.scene) {
                    window.game.scene.start('LaBruteFight');
                    appendCombatLog('🚀 Scène LaBrute démarrée');
                }
            }, 1000);
        });
    </script>
</body>
</html>
